          package com.sebastian.miagenda;

          import org.json.JSONException;
          import org.json.JSONObject;

          /** Una tarea o entrega de la agenda. */
          public class Task {
              public static final String[] PRIO = {"Alta", "Media", "Baja"};

              public long id;
              public String title = "";
              public String cat = "";
              public long due;          // fecha y hora de entrega en milisegundos
              public int prio = 1;      // 0 Alta, 1 Media, 2 Baja
              public boolean done;
              public boolean r1d = true;  // avisar 1 día antes
              public boolean r2h = true;  // avisar 2 horas antes
              public boolean r0 = false;  // avisar a la hora de entrega

              JSONObject toJson() throws JSONException {
                  JSONObject o = new JSONObject();
                  o.put("id", id);
                  o.put("title", title);
                  o.put("cat", cat);
                  o.put("due", due);
                  o.put("prio", prio);
                  o.put("done", done);
                  o.put("r1d", r1d);
                  o.put("r2h", r2h);
                  o.put("r0", r0);
                  return o;
              }

              static Task fromJson(JSONObject o) {
                  Task t = new Task();
                  t.id = o.optLong("id");
                  t.title = o.optString("title", "");
                  t.cat = o.optString("cat", "");
                  t.due = o.optLong("due");
                  t.prio = o.optInt("prio", 1);
                  t.done = o.optBoolean("done", false);
                  t.r1d = o.optBoolean("r1d", true);
                  t.r2h = o.optBoolean("r2h", true);
                  t.r0 = o.optBoolean("r0", false);
                  return t;
              }
          }
