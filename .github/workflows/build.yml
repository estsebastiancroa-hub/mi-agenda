# Mi Agenda - compila la app de Android y publica el APK para descargar.
# Este archivo contiene TODO el código de la app: GitHub lo arma y genera el APK.
name: Construir APK de Mi Agenda

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Crear el proyecto de la app
        run: |
          mkdir -p app
          cat > app/build.gradle <<'EOF_MI_AGENDA'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sebastian.miagenda'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.sebastian.miagenda'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF_MI_AGENDA
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_MI_AGENDA'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="Mi Agenda"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver android:name=".ReminderReceiver" android:exported="false" />

                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF_MI_AGENDA
          mkdir -p app/src/main/java/com/sebastian/miagenda
          cat > app/src/main/java/com/sebastian/miagenda/BootReceiver.java <<'EOF_MI_AGENDA'
          package com.sebastian.miagenda;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          /** Al reiniciar el celular las alarmas se borran: aquí se vuelven a programar. */
          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context c, Intent intent) {
                  Reminders.rescheduleAll(c);
              }
          }
          EOF_MI_AGENDA
          mkdir -p app/src/main/java/com/sebastian/miagenda
          cat > app/src/main/java/com/sebastian/miagenda/Fmt.java <<'EOF_MI_AGENDA'
          package com.sebastian.miagenda;

          import java.text.SimpleDateFormat;
          import java.util.Calendar;
          import java.util.Date;
          import java.util.Locale;

          /** Utilidades de fechas en español. */
          public class Fmt {
              public static final Locale ES = new Locale("es", "CO");

              public static String due(long ms) {
                  return new SimpleDateFormat("EEE d MMM · h:mm a", ES).format(new Date(ms));
              }

              public static String date(long ms) {
                  return new SimpleDateFormat("EEE d 'de' MMMM yyyy", ES).format(new Date(ms));
              }

              public static String time(long ms) {
                  return new SimpleDateFormat("h:mm a", ES).format(new Date(ms));
              }

              public static String today() {
                  return new SimpleDateFormat("EEEE d 'de' MMMM", ES).format(new Date()).toUpperCase(ES);
              }

              /** Días de calendario entre hoy y la fecha (0 = hoy, 1 = mañana, -1 = ayer). */
              public static int dayDiff(long ms) {
                  Calendar a = Calendar.getInstance();
                  startOfDay(a);
                  Calendar b = Calendar.getInstance();
                  b.setTimeInMillis(ms);
                  startOfDay(b);
                  return (int) Math.round((b.getTimeInMillis() - a.getTimeInMillis()) / 86400000.0);
              }

              private static void startOfDay(Calendar c) {
                  c.set(Calendar.HOUR_OF_DAY, 0);
                  c.set(Calendar.MINUTE, 0);
                  c.set(Calendar.SECOND, 0);
                  c.set(Calendar.MILLISECOND, 0);
              }

              /** Texto relativo: "Vence mañana", "En 3 días", "Venció hace 2 días". */
              public static String rel(long due) {
                  long now = System.currentTimeMillis();
                  int dd = dayDiff(due);
                  if (due < now) {
                      if (dd == 0) return "Venció hoy";
                      if (dd == -1) return "Venció ayer";
                      return "Venció hace " + (-dd) + " días";
                  }
                  if (dd == 0) {
                      long h = (due - now) / 3600000L;
                      return h < 1 ? "Vence en menos de 1 hora" : "Vence hoy, en " + h + " h";
                  }
                  if (dd == 1) return "Vence mañana";
                  return "En " + dd + " días";
              }
          }
          EOF_MI_AGENDA
          mkdir -p app/src/main/java/com/sebastian/miagenda
          cat > app/src/main/java/com/sebastian/miagenda/MainActivity.java <<'EOF_MI_AGENDA'
          package com.sebastian.miagenda;

          import android.app.Activity;
          import android.app.AlarmManager;
          import android.app.AlertDialog;
          import android.app.DatePickerDialog;
          import android.app.TimePickerDialog;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.res.ColorStateList;
          import android.content.res.Configuration;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.text.InputType;
          import android.text.TextUtils;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.ArrayAdapter;
          import android.widget.AutoCompleteTextView;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.HorizontalScrollView;
          import android.widget.LinearLayout;
          import android.widget.RadioButton;
          import android.widget.RadioGroup;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Calendar;
          import java.util.Collections;
          import java.util.List;
          import java.util.TreeSet;

          public class MainActivity extends Activity {

              // ---------- Colores (cambian solos entre modo claro y oscuro) ----------
              int bg, surface, ink, muted, line, accent, accentInk, accentSoft;
              int[] prioFg, prioBg;

              private List<Task> tasks = new ArrayList<>();
              private String filter = "Todas";
              private boolean showDone = false;

              private LinearLayout content, stats, chips, banners, list;
              private TextView todayView;

              private static final String[] DEFAULT_CATS = {"Universidad", "Trabajo", "Personal"};

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setupColors();
                  getWindow().setStatusBarColor(bg);
                  getWindow().setNavigationBarColor(bg);
                  if (!isNight()) {
                      getWindow().getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR | View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR);
                  }
                  buildUi();
                  if (Build.VERSION.SDK_INT >= 33 &&
                          checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1);
                  }
                  ReminderReceiver.ensureChannel(this);
                  Reminders.rescheduleAll(this);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  tasks = TaskStore.load(this);
                  render();
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] res) {
                  render();
              }

              // ---------- Utilidades ----------
              private boolean isNight() {
                  return (getResources().getConfiguration().uiMode & Configuration.UI_MODE_NIGHT_MASK)
                          == Configuration.UI_MODE_NIGHT_YES;
              }

              private int dp(float v) {
                  return Math.round(TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, getResources().getDisplayMetrics()));
              }

              private GradientDrawable box(int fill, int stroke, float radius) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(fill);
                  g.setCornerRadius(dp(radius));
                  if (stroke != 0) g.setStroke(dp(1), stroke);
                  return g;
              }

              private TextView text(String s, float sp, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(TypedValue.COMPLEX_UNIT_SP, sp);
                  t.setTextColor(color);
                  if (bold) t.setTypeface(Typeface.create("sans-serif-medium", Typeface.BOLD));
                  return t;
              }

              private LinearLayout.LayoutParams lp(int w, int h, int top) {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(w, h);
                  p.topMargin = dp(top);
                  return p;
              }

              private void setupColors() {
                  if (isNight()) {
                      bg = Color.parseColor("#121610"); surface = Color.parseColor("#1B2118");
                      ink = Color.parseColor("#E7ECE2"); muted = Color.parseColor("#9BA694");
                      line = Color.parseColor("#2E3729"); accent = Color.parseColor("#A4C46E");
                      accentInk = Color.parseColor("#142008"); accentSoft = Color.parseColor("#27331B");
                      prioFg = new int[]{Color.parseColor("#FF8A80"), Color.parseColor("#E9B44C"), Color.parseColor("#A9B6C2")};
                      prioBg = new int[]{Color.parseColor("#3A1C19"), Color.parseColor("#352A12"), Color.parseColor("#252C33")};
                  } else {
                      bg = Color.parseColor("#F3F5F1"); surface = Color.WHITE;
                      ink = Color.parseColor("#1B2418"); muted = Color.parseColor("#5E6B5A");
                      line = Color.parseColor("#DCE2D6"); accent = Color.parseColor("#3F5A1E");
                      accentInk = Color.WHITE; accentSoft = Color.parseColor("#E3EBD5");
                      prioFg = new int[]{Color.parseColor("#B3261E"), Color.parseColor("#9A6200"), Color.parseColor("#52606D")};
                      prioBg = new int[]{Color.parseColor("#F8E1DE"), Color.parseColor("#F6EAD2"), Color.parseColor("#E6EAEE")};
                  }
              }

              // ---------- Pantalla principal ----------
              private void buildUi() {
                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(bg);

                  ScrollView scroll = new ScrollView(this);
                  content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(dp(18), dp(20), dp(18), dp(110));
                  scroll.addView(content);
                  root.addView(scroll);

                  todayView = text("", 12, muted, true);
                  todayView.setLetterSpacing(0.08f);
                  content.addView(todayView);

                  TextView h1 = text("Mi agenda", 32, ink, true);
                  content.addView(h1, lp(-1, -2, 4));

                  stats = new LinearLayout(this);
                  stats.setOrientation(LinearLayout.HORIZONTAL);
                  content.addView(stats, lp(-1, -2, 14));

                  HorizontalScrollView hs = new HorizontalScrollView(this);
                  hs.setHorizontalScrollBarEnabled(false);
                  chips = new LinearLayout(this);
                  chips.setOrientation(LinearLayout.HORIZONTAL);
                  hs.addView(chips);
                  content.addView(hs, lp(-1, -2, 14));

                  banners = new LinearLayout(this);
                  banners.setOrientation(LinearLayout.VERTICAL);
                  content.addView(banners, lp(-1, -2, 0));

                  list = new LinearLayout(this);
                  list.setOrientation(LinearLayout.VERTICAL);
                  content.addView(list, lp(-1, -2, 6));

                  TextView fab = text("+", 30, accentInk, false);
                  fab.setGravity(Gravity.CENTER);
                  fab.setBackground(box(accent, 0, 18));
                  fab.setElevation(dp(6));
                  fab.setContentDescription("Nueva tarea");
                  fab.setOnClickListener(v -> openDialog(null));
                  FrameLayout.LayoutParams fp = new FrameLayout.LayoutParams(dp(62), dp(62), Gravity.BOTTOM | Gravity.END);
                  fp.setMargins(0, 0, dp(20), dp(24));
                  root.addView(fab, fp);

                  setContentView(root);
              }

              private void render() {
                  long now = System.currentTimeMillis();
                  todayView.setText(Fmt.today());
                  Collections.sort(tasks, (a, b) -> Long.compare(a.due, b.due));

                  int pend = 0, week = 0, late = 0;
                  for (Task t : tasks) {
                      if (t.done) continue;
                      pend++;
                      if (t.due < now) late++;
                      else if (Fmt.dayDiff(t.due) <= 7) week++;
                  }
                  stats.removeAllViews();
                  addStat(String.valueOf(pend), "pendientes", ink);
                  addStat(String.valueOf(week), "esta semana", ink);
                  addStat(String.valueOf(late), "vencidas", late > 0 ? prioFg[0] : ink);

                  // Filtros por materia
                  TreeSet<String> cats = categories();
                  if (!filter.equals("Todas") && !cats.contains(filter)) filter = "Todas";
                  chips.removeAllViews();
                  if (!cats.isEmpty()) {
                      addChip("Todas");
                      for (String c : cats) addChip(c);
                  }

                  renderBanners();

                  list.removeAllViews();
                  if (tasks.isEmpty()) {
                      list.addView(emptyCard("Tu agenda está vacía",
                              "Toca el botón + para agregar tu primera entrega. Aquí las verás ordenadas por fecha, con su materia y prioridad, y el celular te avisará antes de cada una.", true),
                              lp(-1, -2, 18));
                      return;
                  }

                  List<Task> open = new ArrayList<>(), done = new ArrayList<>();
                  for (Task t : tasks) {
                      if (!filter.equals("Todas") && !filter.equals(t.cat)) continue;
                      (t.done ? done : open).add(t);
                  }
                  String[] names = {"Vencidas", "Hoy", "Mañana", "Próximos 7 días", "Más adelante"};
                  for (int g = 0; g < names.length; g++) {
                      List<Task> items = new ArrayList<>();
                      for (Task t : open) if (groupOf(t, now) == g) items.add(t);
                      if (items.isEmpty()) continue;
                      addGroupTitle(names[g], items.size(), g == 0 ? prioFg[0] : ink);
                      for (Task t : items) list.addView(taskCard(t), lp(-1, -2, 8));
                  }
                  if (open.isEmpty()) {
                      list.addView(emptyCard("Todo al día",
                              "No tienes entregas pendientes" + (filter.equals("Todas") ? "." : " en " + filter + "."), false),
                              lp(-1, -2, 18));
                  }
                  if (!done.isEmpty()) {
                      Collections.reverse(done);
                      TextView tg = text((showDone ? "Ocultar" : "Ver") + " completadas (" + done.size() + ")", 14, muted, true);
                      tg.setPadding(0, dp(12), 0, dp(4));
                      tg.setOnClickListener(v -> { showDone = !showDone; render(); });
                      list.addView(tg, lp(-1, -2, 14));
                      if (showDone) for (Task t : done) list.addView(taskCard(t), lp(-1, -2, 8));
                  }
              }

              private int groupOf(Task t, long now) {
                  if (t.due < now) return 0;
                  int dd = Fmt.dayDiff(t.due);
                  if (dd == 0) return 1;
                  if (dd == 1) return 2;
                  if (dd <= 7) return 3;
                  return 4;
              }

              private TreeSet<String> categories() {
                  TreeSet<String> s = new TreeSet<>(String.CASE_INSENSITIVE_ORDER);
                  for (Task t : tasks) if (!t.cat.isEmpty()) s.add(t.cat);
                  return s;
              }

              private void addStat(String num, String label, int numColor) {
                  LinearLayout s = new LinearLayout(this);
                  s.setOrientation(LinearLayout.VERTICAL);
                  s.setPadding(dp(12), dp(10), dp(12), dp(10));
                  s.setBackground(box(surface, line, 12));
                  s.addView(text(num, 24, numColor, true));
                  s.addView(text(label, 12, muted, false));
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(0, -2, 1f);
                  if (stats.getChildCount() > 0) p.leftMargin = dp(8);
                  stats.addView(s, p);
              }

              private void addChip(String c) {
                  boolean on = c.equals(filter);
                  TextView t = text(c, 13, on ? accentInk : ink, true);
                  t.setPadding(dp(14), dp(7), dp(14), dp(7));
                  t.setBackground(box(on ? accent : surface, on ? accent : line, 999));
                  t.setOnClickListener(v -> { filter = c; render(); });
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-2, -2);
                  if (chips.getChildCount() > 0) p.leftMargin = dp(8);
                  chips.addView(t, p);
              }

              private void addGroupTitle(String name, int n, int color) {
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.BOTTOM);
                  row.addView(text(name, 16, color, true));
                  TextView c = text("  " + n, 13, muted, false);
                  row.addView(c);
                  list.addView(row, lp(-1, -2, 20));
              }

              private View emptyCard(String title, String body, boolean withButton) {
                  LinearLayout e = new LinearLayout(this);
                  e.setOrientation(LinearLayout.VERTICAL);
                  e.setPadding(dp(20), dp(20), dp(20), dp(20));
                  e.setBackground(box(surface, line, 14));
                  e.addView(text(title, 19, ink, true));
                  TextView b = text(body, 14, muted, false);
                  e.addView(b, lp(-1, -2, 6));
                  if (withButton) {
                      Button btn = primaryButton("Agregar mi primera tarea");
                      btn.setOnClickListener(v -> openDialog(null));
                      e.addView(btn, lp(-2, -2, 14));
                  }
                  return e;
              }

              private Button primaryButton(String s) {
                  Button btn = new Button(this);
                  btn.setText(s);
                  btn.setAllCaps(false);
                  btn.setTextColor(accentInk);
                  btn.setBackground(box(accent, 0, 12));
                  btn.setPadding(dp(18), 0, dp(18), 0);
                  return btn;
              }

              private View taskCard(Task t) {
                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.HORIZONTAL);
                  card.setPadding(dp(8), dp(10), dp(14), dp(12));
                  card.setBackground(box(surface, line, 14));

                  CheckBox cb = new CheckBox(this);
                  cb.setChecked(t.done);
                  cb.setButtonTintList(ColorStateList.valueOf(accent));
                  cb.setContentDescription(t.done ? "Marcar como pendiente" : "Marcar como hecha");
                  cb.setOnCheckedChangeListener((v, checked) -> {
                      t.done = checked;
                      TaskStore.save(this, tasks);
                      Reminders.schedule(this, t);
                      if (checked) Toast.makeText(this, "¡Bien! Tarea completada", Toast.LENGTH_SHORT).show();
                      list.post(this::render);
                  });
                  card.addView(cb, new LinearLayout.LayoutParams(-2, -2));

                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);

                  LinearLayout top = new LinearLayout(this);
                  top.setOrientation(LinearLayout.HORIZONTAL);
                  TextView title = text(t.title, 16, t.done ? muted : ink, true);
                  if (t.done) title.setPaintFlags(title.getPaintFlags() | android.graphics.Paint.STRIKE_THRU_TEXT_FLAG);
                  top.addView(title, new LinearLayout.LayoutParams(0, -2, 1f));
                  TextView pill = text(Task.PRIO[t.prio].toUpperCase(Fmt.ES), 10, prioFg[t.prio], true);
                  pill.setLetterSpacing(0.05f);
                  pill.setPadding(dp(8), dp(2), dp(8), dp(2));
                  pill.setBackground(box(prioBg[t.prio], 0, 999));
                  LinearLayout.LayoutParams pp = new LinearLayout.LayoutParams(-2, -2);
                  pp.leftMargin = dp(8);
                  top.addView(pill, pp);
                  col.addView(top);

                  String meta = (t.cat.isEmpty() ? "" : t.cat + "  ·  ") + Fmt.due(t.due);
                  col.addView(text(meta, 13, muted, false), lp(-1, -2, 4));

                  if (!t.done) {
                      boolean late = t.due < System.currentTimeMillis();
                      col.addView(text(Fmt.rel(t.due), 13, late ? prioFg[0] : ink, true), lp(-1, -2, 4));
                  }
                  LinearLayout.LayoutParams cp = new LinearLayout.LayoutParams(0, -2, 1f);
                  cp.leftMargin = dp(4);
                  card.addView(col, cp);

                  card.setOnClickListener(v -> openDialog(t));
                  return card;
              }

              // ---------- Avisos de permisos ----------
              private void renderBanners() {
                  banners.removeAllViews();
                  if (Build.VERSION.SDK_INT >= 33 &&
                          checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                      addBanner("Las notificaciones están desactivadas. Actívalas para que la app te avise de tus entregas.",
                              "Activar notificaciones", () -> {
                                  Intent i = new Intent(Settings.ACTION_APP_NOTIFICATION_SETTINGS);
                                  i.putExtra(Settings.EXTRA_APP_PACKAGE, getPackageName());
                                  startActivity(i);
                              });
                  }
                  AlarmManager am = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                  if (Build.VERSION.SDK_INT >= 31 && am != null && !am.canScheduleExactAlarms()) {
                      addBanner("Permite \"Alarmas y recordatorios\" para que los avisos lleguen a la hora exacta.",
                              "Permitir", () -> startActivity(new Intent(Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM,
                                      Uri.parse("package:" + getPackageName()))));
                  }
              }

              private void addBanner(String msg, String action, Runnable r) {
                  LinearLayout bnr = new LinearLayout(this);
                  bnr.setOrientation(LinearLayout.VERTICAL);
                  bnr.setPadding(dp(14), dp(12), dp(14), dp(12));
                  bnr.setBackground(box(prioBg[1], 0, 12));
                  bnr.addView(text(msg, 14, ink, false));
                  TextView a = text(action, 14, prioFg[1], true);
                  a.setPadding(0, dp(8), 0, 0);
                  a.setOnClickListener(v -> {
                      try { r.run(); } catch (Exception e) {
                          Toast.makeText(this, "Ábrelo desde Ajustes > Apps > Mi Agenda", Toast.LENGTH_LONG).show();
                      }
                  });
                  bnr.addView(a);
                  banners.addView(bnr, lp(-1, -2, 12));
              }

              // ---------- Crear / editar tarea ----------
              private void openDialog(Task existing) {
                  final boolean editing = existing != null;
                  final Calendar due = Calendar.getInstance();
                  if (editing) {
                      due.setTimeInMillis(existing.due);
                  } else {
                      due.add(Calendar.DAY_OF_YEAR, 1);
                      due.set(Calendar.HOUR_OF_DAY, 23);
                      due.set(Calendar.MINUTE, 59);
                  }
                  due.set(Calendar.SECOND, 0);
                  due.set(Calendar.MILLISECOND, 0);

                  LinearLayout v = new LinearLayout(this);
                  v.setOrientation(LinearLayout.VERTICAL);
                  v.setPadding(dp(22), dp(10), dp(22), dp(6));

                  v.addView(label("¿Qué tienes que hacer?"));
                  EditText title = new EditText(this);
                  title.setHint("Ej.: Taller de gráficos de control");
                  title.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_FLAG_CAP_SENTENCES);
                  if (editing) title.setText(existing.title);
                  v.addView(title);

                  v.addView(label("Materia o categoría"));
                  AutoCompleteTextView cat = new AutoCompleteTextView(this);
                  cat.setHint("Ej.: Ingeniería de Calidad");
                  cat.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_FLAG_CAP_WORDS);
                  TreeSet<String> all = categories();
                  all.addAll(Arrays.asList(DEFAULT_CATS));
                  cat.setAdapter(new ArrayAdapter<>(this, android.R.layout.simple_dropdown_item_1line, new ArrayList<>(all)));
                  cat.setThreshold(0);
                  cat.setOnFocusChangeListener((x, f) -> { if (f) cat.showDropDown(); });
                  cat.setOnClickListener(x -> cat.showDropDown());
                  if (editing) cat.setText(existing.cat);
                  else if (!filter.equals("Todas")) cat.setText(filter);
                  v.addView(cat);

                  v.addView(label("Fecha y hora de entrega"));
                  LinearLayout dt = new LinearLayout(this);
                  dt.setOrientation(LinearLayout.HORIZONTAL);
                  Button dateBtn = outlineButton(Fmt.date(due.getTimeInMillis()));
                  Button timeBtn = outlineButton(Fmt.time(due.getTimeInMillis()));
                  dateBtn.setOnClickListener(x -> new DatePickerDialog(this, (dp, y, m, d) -> {
                      due.set(y, m, d);
                      dateBtn.setText(Fmt.date(due.getTimeInMillis()));
                  }, due.get(Calendar.YEAR), due.get(Calendar.MONTH), due.get(Calendar.DAY_OF_MONTH)).show());
                  timeBtn.setOnClickListener(x -> new TimePickerDialog(this, (tp, h, m) -> {
                      due.set(Calendar.HOUR_OF_DAY, h);
                      due.set(Calendar.MINUTE, m);
                      timeBtn.setText(Fmt.time(due.getTimeInMillis()));
                  }, due.get(Calendar.HOUR_OF_DAY), due.get(Calendar.MINUTE), false).show());
                  dt.addView(dateBtn, new LinearLayout.LayoutParams(0, -2, 1.6f));
                  LinearLayout.LayoutParams tpl = new LinearLayout.LayoutParams(0, -2, 1f);
                  tpl.leftMargin = dp(8);
                  dt.addView(timeBtn, tpl);
                  v.addView(dt);

                  v.addView(label("Prioridad"));
                  RadioGroup rg = new RadioGroup(this);
                  rg.setOrientation(RadioGroup.HORIZONTAL);
                  RadioButton[] rb = new RadioButton[3];
                  for (int i = 0; i < 3; i++) {
                      rb[i] = new RadioButton(this);
                      rb[i].setId(View.generateViewId());
                      rb[i].setText(Task.PRIO[i]);
                      rb[i].setTextColor(ink);
                      rb[i].setButtonTintList(ColorStateList.valueOf(prioFg[i]));
                      rg.addView(rb[i], new RadioGroup.LayoutParams(0, -2, 1f));
                  }
                  rb[editing ? existing.prio : 1].setChecked(true);
                  v.addView(rg);

                  v.addView(label("Avisarme"));
                  CheckBox c1 = check("1 día antes", editing ? existing.r1d : true);
                  CheckBox c2 = check("2 horas antes", editing ? existing.r2h : true);
                  CheckBox c3 = check("A la hora de entrega", editing ? existing.r0 : false);
                  v.addView(c1);
                  v.addView(c2);
                  v.addView(c3);

                  ScrollView sv = new ScrollView(this);
                  sv.addView(v);

                  AlertDialog.Builder b = new AlertDialog.Builder(this)
                          .setTitle(editing ? "Editar tarea" : "Nueva tarea")
                          .setView(sv)
                          .setPositiveButton("Guardar", null)
                          .setNegativeButton("Cancelar", null);
                  if (editing) b.setNeutralButton("Eliminar", null);
                  AlertDialog d = b.create();
                  d.setOnShowListener(x -> {
                      d.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener(y -> {
                          String tt = title.getText().toString().trim();
                          if (TextUtils.isEmpty(tt)) {
                              title.setError("Escribe qué tienes que hacer");
                              return;
                          }
                          Task t = editing ? existing : new Task();
                          if (!editing) {
                              t.id = System.currentTimeMillis();
                              tasks.add(t);
                          }
                          t.title = tt;
                          t.cat = cat.getText().toString().trim();
                          t.due = due.getTimeInMillis();
                          int checkedId = rg.getCheckedRadioButtonId();
                          for (int i = 0; i < 3; i++) if (rb[i].getId() == checkedId) t.prio = i;
                          t.r1d = c1.isChecked();
                          t.r2h = c2.isChecked();
                          t.r0 = c3.isChecked();
                          TaskStore.save(this, tasks);
                          Reminders.schedule(this, t);
                          if (!t.done && t.due < System.currentTimeMillis()) {
                              Toast.makeText(this, "Ojo: la fecha de entrega ya pasó", Toast.LENGTH_LONG).show();
                          } else if (!t.done && (t.r1d || t.r2h || t.r0)) {
                              Toast.makeText(this, "Guardada. Te avisaré antes de la entrega", Toast.LENGTH_SHORT).show();
                          }
                          d.dismiss();
                          render();
                      });
                      if (editing) {
                          d.getButton(AlertDialog.BUTTON_NEUTRAL).setTextColor(prioFg[0]);
                          d.getButton(AlertDialog.BUTTON_NEUTRAL).setOnClickListener(y ->
                                  new AlertDialog.Builder(this)
                                          .setTitle("¿Eliminar esta tarea?")
                                          .setMessage(existing.title + "\n\nNo se puede deshacer.")
                                          .setPositiveButton("Eliminar", (a, w) -> {
                                              Reminders.cancel(this, existing);
                                              tasks.remove(existing);
                                              TaskStore.save(this, tasks);
                                              d.dismiss();
                                              render();
                                          })
                                          .setNegativeButton("Cancelar", null)
                                          .show());
                      }
                  });
                  d.show();
              }

              private TextView label(String s) {
                  TextView t = text(s, 13, muted, true);
                  t.setPadding(0, dp(14), 0, dp(2));
                  return t;
              }

              private Button outlineButton(String s) {
                  Button btn = new Button(this);
                  btn.setText(s);
                  btn.setAllCaps(false);
                  btn.setTextColor(ink);
                  btn.setBackground(box(bg, line, 10));
                  return btn;
              }

              private CheckBox check(String s, boolean on) {
                  CheckBox c = new CheckBox(this);
                  c.setText(s);
                  c.setTextColor(ink);
                  c.setChecked(on);
                  c.setButtonTintList(ColorStateList.valueOf(accent));
                  return c;
              }
          }
