          cat > app/src/main/java/com/sebastian/miagenda/TaskStore.java <<'EOF_MI_AGENDA'
          package com.sebastian.miagenda;

          import android.content.Context;
          import android.content.SharedPreferences;

          import org.json.JSONArray;
          import org.json.JSONException;

          import java.util.ArrayList;
          import java.util.List;

          /** Guarda las tareas en el celular (SharedPreferences, en formato JSON). */
          public class TaskStore {
              private static final String PREFS = "agenda";
              private static final String KEY = "tareas";

              public static List<Task> load(Context c) {
                  List<Task> list = new ArrayList<>();
                  SharedPreferences p = c.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                  try {
                      JSONArray a = new JSONArray(p.getString(KEY, "[]"));
                      for (int i = 0; i < a.length(); i++) list.add(Task.fromJson(a.getJSONObject(i)));
                  } catch (JSONException ignored) { }
                  return list;
              }

              public static void save(Context c, List<Task> list) {
                  JSONArray a = new JSONArray();
                  try {
                      for (Task t : list) a.put(t.toJson());
                  } catch (JSONException ignored) { }
                  c.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putString(KEY, a.toString()).apply();
              }

              public static Task find(Context c, long id) {
                  for (Task t : load(c)) if (t.id == id) return t;
                  return null;
              }
          }
