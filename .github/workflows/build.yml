          package com.sebastian.miagenda;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Build;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;

          /** Recibe las alarmas y muestra la notificación. */
          public class ReminderReceiver extends BroadcastReceiver {
              static final String CHANNEL = "entregas";

              @Override
              public void onReceive(Context c, Intent intent) {
                  String action = intent.getAction();
                  if (Reminders.ACTION_DAILY.equals(action)) {
                      Reminders.scheduleDaily(c); // programa el de mañana
                      dailySummary(c);
                      return;
                  }
                  long id = intent.getLongExtra("id", -1);
                  int kind = intent.getIntExtra("kind", 0);
                  Task t = TaskStore.find(c, id);
                  if (t == null || t.done) return;

                  String title;
                  if (kind == 0) title = "Mañana se entrega: " + t.title;
                  else if (kind == 1) title = "En 2 horas se entrega: " + t.title;
                  else title = "Hora de entregar: " + t.title;
                  String text = (t.cat.isEmpty() ? "" : t.cat + " · ") + Fmt.due(t.due)
                          + " · Prioridad " + Task.PRIO[t.prio];
                  show(c, Reminders.code(t.id, kind), title, text);
              }

              private void dailySummary(Context c) {
                  long now = System.currentTimeMillis();
                  List<Task> list = TaskStore.load(c);
                  Collections.sort(list, (a, b) -> Long.compare(a.due, b.due));
                  int late = 0, today = 0, tomorrow = 0;
                  List<String> lines = new ArrayList<>();
                  for (Task t : list) {
                      if (t.done) continue;
                      int dd = Fmt.dayDiff(t.due);
                      if (t.due < now) { late++; lines.add("Vencida: " + t.title); }
                      else if (dd == 0) { today++; lines.add("Hoy " + Fmt.time(t.due) + ": " + t.title); }
                      else if (dd == 1) { tomorrow++; lines.add("Mañana: " + t.title); }
                  }
                  if (late + today + tomorrow == 0) return;
                  String title = "Hoy tienes " + today + (today == 1 ? " entrega" : " entregas")
                          + " y mañana " + tomorrow;
                  StringBuilder sb = new StringBuilder();
                  if (late > 0) sb.append(late).append(late == 1 ? " vencida pendiente\n" : " vencidas pendientes\n");
                  for (int i = 0; i < Math.min(lines.size(), 6); i++) sb.append(lines.get(i)).append('\n');
                  show(c, 1999999998, title, sb.toString().trim());
              }

              static void ensureChannel(Context c) {
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null || nm.getNotificationChannel(CHANNEL) != null) return;
                  NotificationChannel ch = new NotificationChannel(CHANNEL, "Entregas y recordatorios",
                          NotificationManager.IMPORTANCE_HIGH);
                  ch.setDescription("Avisos de tus tareas antes de la fecha de entrega");
                  ch.enableVibration(true);
                  nm.createNotificationChannel(ch);
              }

              static void show(Context c, int nid, String title, String text) {
                  if (Build.VERSION.SDK_INT >= 33 &&
                          c.checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                      return;
                  }
                  ensureChannel(c);
                  Intent open = new Intent(c, MainActivity.class);
                  open.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent pi = PendingIntent.getActivity(c, 0, open,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  Notification n = new Notification.Builder(c, CHANNEL)
                          .setSmallIcon(android.R.drawable.ic_popup_reminder)
                          .setColor(Color.parseColor("#3F5A1E"))
                          .setContentTitle(title)
                          .setContentText(text)
                          .setStyle(new Notification.BigTextStyle().bigText(text))
                          .setContentIntent(pi)
                          .setAutoCancel(true)
                          .setCategory(Notification.CATEGORY_REMINDER)
                          .build();
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm != null) nm.notify(nid, n);
              }
          }
