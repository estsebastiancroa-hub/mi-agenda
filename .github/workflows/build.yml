          package com.sebastian.miagenda;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;

          import java.util.Calendar;

          /** Programa y cancela las alarmas de cada tarea y el resumen diario. */
          public class Reminders {
              public static final String ACTION_REMIND = "com.sebastian.miagenda.REMIND";
              public static final String ACTION_DAILY = "com.sebastian.miagenda.DAILY";

              // 0 = 1 día antes, 1 = 2 horas antes, 2 = a la hora de entrega
              static final long[] OFFSETS = {86400000L, 7200000L, 0L};

              // Hora del resumen diario (6:30 a. m.)
              static final int DAILY_HOUR = 6, DAILY_MIN = 30;
              private static final int DAILY_CODE = 1999999999;

              static int code(long id, int kind) {
                  return (int) ((id % 1000000L) * 4 + kind);
              }

              private static PendingIntent taskIntent(Context c, Task t, int kind) {
                  Intent i = new Intent(c, ReminderReceiver.class);
                  i.setAction(ACTION_REMIND);
                  i.putExtra("id", t.id);
                  i.putExtra("kind", kind);
                  return PendingIntent.getBroadcast(c, code(t.id, kind), i,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              private static void setAlarm(Context c, long at, PendingIntent pi) {
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  if (am == null) return;
                  if (Build.VERSION.SDK_INT >= 31 && !am.canScheduleExactAlarms()) {
                      am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, pi);
                  } else {
                      am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, pi);
                  }
              }

              public static void schedule(Context c, Task t) {
                  cancel(c, t);
                  if (t.done) return;
                  boolean[] on = {t.r1d, t.r2h, t.r0};
                  long now = System.currentTimeMillis();
                  for (int k = 0; k < 3; k++) {
                      if (!on[k]) continue;
                      long at = t.due - OFFSETS[k];
                      if (at > now) setAlarm(c, at, taskIntent(c, t, k));
                  }
              }

              public static void cancel(Context c, Task t) {
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  if (am == null) return;
                  for (int k = 0; k < 3; k++) am.cancel(taskIntent(c, t, k));
              }

              public static void scheduleDaily(Context c) {
                  Calendar cal = Calendar.getInstance();
                  cal.set(Calendar.HOUR_OF_DAY, DAILY_HOUR);
                  cal.set(Calendar.MINUTE, DAILY_MIN);
                  cal.set(Calendar.SECOND, 0);
                  cal.set(Calendar.MILLISECOND, 0);
                  if (cal.getTimeInMillis() <= System.currentTimeMillis()) cal.add(Calendar.DAY_OF_YEAR, 1);
                  Intent i = new Intent(c, ReminderReceiver.class);
                  i.setAction(ACTION_DAILY);
                  PendingIntent pi = PendingIntent.getBroadcast(c, DAILY_CODE, i,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  setAlarm(c, cal.getTimeInMillis(), pi);
              }

              public static void rescheduleAll(Context c) {
                  for (Task t : TaskStore.load(c)) schedule(c, t);
                  scheduleDaily(c);
              }
          }
